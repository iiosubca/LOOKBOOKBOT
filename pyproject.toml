[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lookbookbot"
version = "0.1.0"
description = "Evidence-gated Windows desktop application for TSUM lookbook production"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pyinstaller>=6.11,<7",
]

[project.scripts]
lookbookbot = "lookbookbot.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

